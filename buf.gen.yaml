version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: gen/pkg
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    revision: 2
    out: gen/pkg
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
  - remote: buf.build/connectrpc/go:v1.19.1
    out: gen/pkg
    opt:
      - paths=source_relative
  # TypeScript - Protobuf ES
  # import_extension=js keeps relative imports explicit (./foo_pb.js) so the
  # compiled dist/ is resolvable under plain Node ESM, not just bundlers.
  - remote: buf.build/bufbuild/es:v2.9.0
    out: gen/ts/src
    opt:
      - target=ts
      - import_extension=js
    include_imports: true
    include_wkt: true
inputs:
  - directory: proto
